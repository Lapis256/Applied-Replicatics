[libraries]

junit = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
dokka-versioning = { module = "org.jetbrains.dokka:versioning-plugin", version.ref = "plugin-dokka" }

spark = { module = "curse.maven:spark-361579", version.ref = "spark" }
jei = { module = "mezz.jei:jei-1.20.1-forge", version.ref = "jei" }
emi = { module = "dev.emi:emi-forge", version.ref = "emi" }
ae2 = { module = "curse.maven:applied-energistics-2-223794", version.ref = "ae2" }
titanium = { module = "com.hrznstudio:titanium", version.ref = "titanium" }
replication = { module = "curse.maven:replication-638351", version.ref = "replication" }
megaCells = { module = "curse.maven:mega-cells-622112", version.ref = "megaCells" }
goldium = { module = "curse.maven:glodium-957920", version.ref = "goldium" }
geckolib = { module = "curse.maven:geckolib-388172", version.ref = "geckolib" }
advancedAE = { module = "curse.maven:advancedae-1084104", version.ref = "advancedAE" }
appliedFlux = { module = "curse.maven:applied-flux-965012", version.ref = "appliedFlux" }
mezzConfig = { module = "curse.maven:mezzconfig-1689768", version.ref = "mezzConfig" }
guideme = { module = "curse.maven:guideme-1173950", version.ref = "guideme" }
clothConfig = { module = "curse.maven:cloth-config-348521", version.ref = "clothConfig" }

ec4j = { module = "org.ec4j.core:ec4j-core", version.ref = "ec4j" }
mixin = { module = "org.spongepowered:mixin", version.ref = "mixin" }
mixinextras-forge = { module = "io.github.llamalad7:mixinextras-forge", version.ref = "mixinextras" }
mixinextras-common = { module = "io.github.llamalad7:mixinextras-common", version.ref = "mixinextras" }


[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "plugin-spotless" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "plugin-kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "plugin-kotlin" }
moddev = { id = "net.neoforged.moddev.legacyforge", version.ref = "plugin-moddev" }
modPublishPlugin = { id = "me.modmuss50.mod-publish-plugin", version.ref = "plugin-modPublishPlugin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "plugin-dokka" }
dokka-javadoc = { id = "org.jetbrains.dokka-javadoc", version.ref = "plugin-dokka" }


[bundles]
implementation = [
    "mixinextras-forge"
]

compileOnly = [
    "mixinextras-common"
]

modImplementation = [
    "ae2",
    "titanium",
    "replication"
]

modRuntimeOnly = [
    "guideme",
    "spark",
    "mezzConfig",
    "jei"
]

modIntegrationImplementation = [
    "megaCells",
    "clothConfig",
    "goldium",
    "appliedFlux"
]

modIntegrationCompileOnly = [
    "jei",
    "emi"
]

modOptionalModsRuntimeOnly = [
    "emi"
]

modDataImplementation = [
    "advancedAE"
]

modDataRuntimeOnly = [
    "geckolib"
]

testImplementation = [
    "junit"
]

testRuntimeOnly = [
    "junit-platform-launcher",
    "junit-jupiter-engine"
]
